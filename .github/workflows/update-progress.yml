name: Update LeetCode Progress

on:
  schedule:
    # Runs everyday at midnight UTC (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime
  push:
    paths:
      - 'solutions/**' # Automatically refresh README if new solutions are added

permissions:
  contents: write # Grants GitHub Actions built-in token permission to commit and push changes

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LeetCode Tracker
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME || 'smkyuzarsif' }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/leetcode_tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if README.md, data/progress.json or assets were changed
          if git status --porcelain | grep -E '(README\.md|data/progress\.json|assets/)'; then
            echo "Changes detected in progress, heatmap, or README. Committing..."
            git add README.md data/progress.json assets/
            git commit -m "chore(tracker): automated leetcode progress update [skip ci]"
            git push
          else
            echo "No changes in progress data. Skipping commit."
          fi
