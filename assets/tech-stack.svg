<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="'Segoe UI', 'JetBrains Mono', 'Consolas', monospace">
  <defs>
    <!-- Gold radial gradient for top-left ornament -->
    <radialGradient id="goldOrn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="55%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#6B3410" stop-opacity="0"/>
    </radialGradient>
    <!-- Grey radial gradient for bottom-right ornament -->
    <radialGradient id="greyOrn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="55%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle red glow for DSA highlight -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="860" height="540" fill="#000000" rx="8"/>

  <!-- ═══ PURPLE BORDER ═══ -->
  <rect x="10" y="10" width="840" height="520" fill="none" stroke="#7C3AED" stroke-width="1.5" rx="6"/>

  <!-- ═══ GOLD ORNAMENT — top-left ═══ -->
  <circle cx="10" cy="10" r="58" fill="url(#goldOrn)" opacity="0.85"/>
  <!-- inner ring lines -->
  <circle cx="10" cy="10" r="36" fill="none" stroke="#FDE047" stroke-width="0.7" opacity="0.5"/>
  <circle cx="10" cy="10" r="24" fill="none" stroke="#B45309" stroke-width="0.5" opacity="0.6"/>

  <!-- ═══ GREY ORNAMENT — bottom-right ═══ -->
  <circle cx="850" cy="530" r="58" fill="url(#greyOrn)" opacity="0.80"/>
  <circle cx="850" cy="530" r="36" fill="none" stroke="#9CA3AF" stroke-width="0.7" opacity="0.45"/>
  <circle cx="850" cy="530" r="24" fill="none" stroke="#6B7280" stroke-width="0.5" opacity="0.5"/>

